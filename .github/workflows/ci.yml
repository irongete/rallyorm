name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release Gate
        run: npm run release:check

      # Coverage thresholds (.c8rc.json) are enforced once per run; the same step
      # produces the shields.io endpoint JSON consumed by the README badges.
      - name: Coverage thresholds and badge data
        if: matrix.node-version == 22
        run: npm run coverage:badges

      - name: Upload badge data
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: coverage/badges
          retention-days: 1

  # Publishes coverage/tests badge data to the orphan `badges` branch, which the
  # README references through https://img.shields.io/endpoint. Only the default
  # GITHUB_TOKEN is involved; the branch is rewritten on every push to main.
  badges:
    name: Publish badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download badge data
        uses: actions/download-artifact@v4
        with:
          name: badges
          path: badges

      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Badge data for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges

  live-validation:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      RALLY_API_KEY: ${{ secrets.RALLY_API_KEY }}
      RALLY_WORKSPACE: ${{ secrets.RALLY_WORKSPACE }}
      RALLY_BASE_URL: ${{ secrets.RALLY_BASE_URL }}
      RALLY_TEST_PROJECT_OID: ${{ secrets.RALLY_TEST_PROJECT_OID }}
      RALLY_TEST_USERSTORY_OID: ${{ secrets.RALLY_TEST_USERSTORY_OID }}
      RALLY_TEST_TESTCASE_OID: ${{ secrets.RALLY_TEST_TESTCASE_OID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip when live validation inputs are unavailable
        if: env.RALLY_API_KEY == '' || env.RALLY_TEST_PROJECT_OID == ''
        run: echo "Skipping live validation because RALLY_API_KEY or RALLY_TEST_PROJECT_OID is not configured in repository secrets."

      - name: Release Gate With Live Rally Validation
        if: env.RALLY_API_KEY != '' && env.RALLY_TEST_PROJECT_OID != ''
        run: npm run release:check:live
